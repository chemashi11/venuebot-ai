version: '3.8'
services:
  db:
    image: postgres:15
    environment:
      POSTGRES_USER: venuebot_admin
      POSTGRES_PASSWORD: secretpassword
      POSTGRES_DB: venuebot_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  backend:
    build: ./backend
    ports:
      - "8000:8000"
    depends_on:
      - db
    environment:
      - DATABASE_URL=postgresql://venuebot_admin:secretpassword@db:5432/venuebot_db
    volumes:
      - ./backend:/app

volumes:
  postgres_data: